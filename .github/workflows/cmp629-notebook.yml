name: CMP629 Corrigir Autoria no Notebook
on:
  workflow_dispatch:
  push:
    paths:
      - mountaincar-tabular/scripts/corrigir_autoria_notebook.py
permissions:
  contents: write
jobs:
  corrigir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Substituir somente as quatro linhas de autores
        run: python mountaincar-tabular/scripts/corrigir_autoria_notebook.py
      - name: Publicar notebook
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mountaincar-tabular/entrega_final/CMP629_MOUNTAINCAR_ENTREGA_FINAL.ipynb
          git diff --cached --stat
          git commit -m "docs(CMP629): autoria alfabetica no notebook de entrega"
          git push origin HEAD:main
