name: CMP629 Publicar Relatorio Corrigido
on:
  workflow_dispatch:
  push:
    paths:
      - mountaincar-tabular/scripts/corrigir_relatorio_github.py
permissions:
  contents: write
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencias de conversao
        run: pip install pymupdf==1.26.7 pdf2docx==0.5.8 python-docx==1.2.0
      - name: Corrigir e validar 29 paginas
        run: python mountaincar-tabular/scripts/corrigir_relatorio_github.py
      - name: Publicar binarios corrigidos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mountaincar-tabular/entrega_final/CMP629_MOUNTAINCAR_RELATORIO_DEFINITIVO.pdf
          git add mountaincar-tabular/entrega_final/CMP629_MOUNTAINCAR_RELATORIO_EDITAVEL.docx
          git diff --cached --stat
          git commit -m "docs(CMP629): corrigir PDF definitivo e publicar Word editavel"
          git push origin HEAD:main
