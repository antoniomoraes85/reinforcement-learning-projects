name: CMP629 Preparar Pacote do Grupo
on:
  workflow_dispatch:
  push:
    paths:
      - mountaincar-tabular/scripts/preparar_pacote_grupo.py
permissions:
  contents: write
jobs:
  pacote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.26.7 python-docx==1.2.0
      - run: python mountaincar-tabular/scripts/preparar_pacote_grupo.py
      - name: Publicar pacote verificado
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mountaincar-tabular/entrega_final/CMP629_MOUNTAINCAR_PACOTE_GRUPO.zip
          git add mountaincar-tabular/entrega_final/LEIA_ME_GRUPO.md
          git commit -m "release(CMP629): pacote grupo com notebook PDF e DOCX"
          git push origin HEAD:main
