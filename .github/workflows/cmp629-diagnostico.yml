name: CMP629 Diagnostico editorial
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cmp629-diagnostico.yml
permissions:
  contents: read
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.26.7
      - name: Inspecionar autores e fontes do PDF
        run: |
          python - <<'PY'
          import fitz
          p=fitz.open('mountaincar-tabular/entrega_final/CMP629_MOUNTAINCAR_RELATORIO_DEFINITIVO.pdf')
          print('TOTAL_PAGES',len(p))
          indices=[0]+[i for i,pg in enumerate(p) if 'ANTONIOMORAES85' in pg.get_text().upper() or 'UNIVERSIDADE FEDERAL DO RIO GRANDE DO SUL.' in pg.get_text().upper()]
          print('TARGET_PAGES',indices)
          for i in dict.fromkeys(indices):
              print('--- PAGE',i+1,'---')
              print(p[i].get_text()[:20000])
              for bl in p[i].get_text('dict')['blocks']:
                  if bl['type'] != 0: continue
                  for line in bl['lines']:
                      tx=''.join(sp['text'] for sp in line['spans']).strip()
                      if (i==0 and 105 < line['bbox'][1] < 325) or 'ANTONIOMORAES85' in tx.upper() or 'UNIVERSIDADE FEDERAL DO RIO GRANDE DO SUL' in tx.upper():
                          print('LINE_BOX',tuple(round(v,1) for v in line['bbox']),repr(tx[:230]))
          PY
