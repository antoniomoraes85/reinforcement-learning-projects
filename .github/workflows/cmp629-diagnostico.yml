name: CMP629 Diagnostico editorial
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/cmp629-diagnostico.yml
permissions:
  contents: read
jobs:
  extrair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pymupdf==1.26.7
      - name: Inspecionar autoria e referencias do PDF publicado
        run: |
          python - <<'PY'
          import fitz, pathlib
          p=fitz.open('mountaincar-tabular/entrega_final/CMP629_MOUNTAINCAR_RELATORIO_DEFINITIVO.pdf')
          print('TOTAL_PAGES',len(p))
          indices=[0]+[i for i,pg in enumerate(p) if 'ANTONIOMORAES85' in pg.get_text().upper() or 'UNIVERSIDADE FEDERAL DO RIO GRANDE DO SUL.' in pg.get_text().upper()]\n          print('TARGET_PAGES',indices)\n          for i in dict.fromkeys(indices):
              print('\n--- PAGE',i+1,'---')
              print(p[i].get_text()[:18000])\n              for line in [ln for bl in p[i].get_text('dict')['blocks'] if bl['type']==0 for ln in bl['lines']]:\n                  tx=''.join(sp['text'] for sp in line['spans']).strip()\n                  if (i==0 and 105 < line['bbox'][1] < 325) or ('ANTONIOMORAES85' in tx.upper()) or ('UNIVERSIDADE FEDERAL DO RIO GRANDE DO SUL' in tx.upper()):\n                      print('LINE_BOX',tuple(round(v,1) for v in line['bbox']), repr(tx[:230]))
          PY
